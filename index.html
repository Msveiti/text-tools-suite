<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Font Preloading for Speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Professional Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Professional Branding -->
    <title>VerboMetrics | Professional Writing Suite</title>
    <meta name="description" content="Advanced text utilities for professional creators. Word counting, lexical density, text comparison, and more." />

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P2JWKFVB39"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Note: Config is handled dynamically in App.tsx to track page changes
      
      // Preload tracking improvements
      document.addEventListener('DOMContentLoaded', function() {
        // Track initial page load
        if (typeof gtag === 'function') {
          gtag('event', 'page_view', {
            page_title: document.title,
            page_location: window.location.href,
            page_path: window.location.pathname
          });
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Schema.org Breadcrumb Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "VerboMetrics",
        "item": "https://verbometrics.com/"
      }, {
        "@type": "ListItem",
        "position": 2,
        "name": "Blog",
        "item": "https://verbometrics.com/blog"
      }]
    }
    </script>
  </body>
</html>
