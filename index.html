<!doctype html>
<html lang="en">
  <head>
    <!-- REDIRECT: Remove .html from URL if present (skip for react-snap crawler) -->
    <script>
      (function() {
        var path = window.location.pathname;
        // Check if it ends in .html AND the visitor is NOT react-snap
        if (path.endsWith('.html') && navigator.userAgent !== 'ReactSnap') {
          var newPath = path.replace(/\.html$/, '');
          var newUrl = newPath + window.location.search + window.location.hash;
          window.location.replace(newUrl);
        }
      })();
    </script>

    <meta charset="UTF-8" />
    
    <!-- Font Preloading for Speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    
    <!-- Professional Favicon -->
    <link rel="icon" type="image/png" href="/verbometrics-logo.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />

    <!--
      Title / description / canonical / Open Graph / Twitter / robots are all
      rendered per route by src/components/SEO.tsx (react-helmet-async).
      Keep only the fallback title here so the static template is still valid.
    -->
    <title>VerboMetrics | Professional Writing Suite</title>
    <meta name="author" content="VerboMetrics" />
    

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P2JWKFVB39"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Page views are sent once per route change from AnalyticsTracker in
      // src/App.tsx. Disable the automatic page_view to avoid double counting.
      gtag('config', 'G-P2JWKFVB39', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Site-wide Organization / WebSite schema. Breadcrumb, Article and tool
         schema are rendered per route by src/components/SEO.tsx. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VerboMetrics",
      "alternateName": "VerboMetrics Writing Suite",
      "url": "https://verbometrics.com/",
      "description": "Advanced text utilities for professional creators. Word counting, lexical density, text comparison, and more.",
      "publisher": {
        "@type": "Organization",
        "name": "VerboMetrics",
        "logo": {
          "@type": "ImageObject",
          "url": "https://verbometrics.com/verbometrics-logo.png"
        }
      }
    }
    </script>
  </body>
</html>
