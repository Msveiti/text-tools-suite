<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Legacy .html URLs are not deployed. Send visitors to the clean URL.
      (function () {
        var path = window.location.pathname;
        if (path.endsWith('.html')) {
          window.location.replace(path.replace(/\.html$/, '') + window.location.search + window.location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | VerboMetrics</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 34rem; padding: 2.5rem; text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: .5rem; font-weight: 900; font-size: 1.25rem; text-decoration: none; color: #0f172a; }
      .mark { width: 2rem; height: 2rem; border-radius: .6rem; background: #4f46e5; color: #fff; display: grid; place-items: center; font-size: .9rem; }
      h1 { font-size: 2rem; margin: 2rem 0 .5rem; letter-spacing: -.02em; }
      p { color: #64748b; line-height: 1.6; margin: 0 0 2rem; }
      a.btn { display: inline-block; background: #4f46e5; color: #fff; text-decoration: none; font-weight: 700; padding: .9rem 1.6rem; border-radius: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><span class="mark">V</span>VerboMetrics</a>
      <h1>We couldn&rsquo;t find that page</h1>
      <p>The link may be broken, or the page may have moved. Every VerboMetrics tool is free and needs no signup.</p>
      <a class="btn" href="/">Back to the word counter</a>
    </main>
  </body>
</html>
